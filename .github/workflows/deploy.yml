name: 🚀 Deploy Angular App

on:
  push:
    branches:
      - main   # ou master, usa o nome da sua branch principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🛠️ Criar Environment de Produção
        run: |
          mkdir -p src/environments
          # Usando printf para evitar quebras de linha indesejadas
          printf "export const environment = {\n  production: true,\n  apiUrl: 'http://%s:8080',\n  appVersion: '1.0.0'\n};" "${{ secrets.VM_HOST }}" > src/environments/environment.prod.ts
          
      - name: 🔍 Debug (Verificar estrutura do arquivo)
        run: cat src/environments/environment.prod.ts | sed 's/[0-9]/x/g' # Mostra a estrutura sem vazar seu IP real

      - name: 🔨 Build do Angular
        run: npm run build -- --configuration production

      - name: 🚀 Deploy no Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy automático"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}