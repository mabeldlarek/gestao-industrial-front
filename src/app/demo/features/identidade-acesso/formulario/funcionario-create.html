<div class="row">
    <div class="col-sm-12">
        <app-card cardTitle="" [options]="false">
            <form action="javascript:void(0)">

                <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                    <div class="bg-light-primary text-primary p-2 rounded-circle mr-3 d-flex align-items-center justify-content-center"
                        style="width: 45px; height: 45px;">
                        <i class="feather icon-user font-weight-bold" style="font-size: 1.2rem;"></i>
                    </div>
                    <div>
                        <h4 class="mb-0 font-weight-600 text-dark">
                            {{ dadosForm?.id ? 'Editar' : 'Cadastro de' }} Funcionário
                        </h4>
                        <small class="text-muted">Informações cadastrais e escala de trabalho</small>
                    </div>
                </div>

                <div ngbAccordion [closeOthers]="true">

                    <!-- Dados Identificadores -->
                    <div ngbAccordionItem [collapsed]="false">
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>
                                <i class="feather icon-info mr-2"></i> Dados Identificadores
                            </button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row">
                                        <div class="form-group col-md-4">
                                            <label>Matrícula</label>
                                            <input type="text" name="matricula" class="form-control"
                                                [(ngModel)]="dadosForm.matricula" />
                                        </div>
                                        <div class="form-group col-md-8">
                                            <label>Nome Completo</label>
                                            <input type="text" name="nome" class="form-control"
                                                [(ngModel)]="dadosForm.nome" />
                                        </div>
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>

                    <!-- Especialidades -->
                    <div ngbAccordionItem>
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>
                                <i class="feather icon-award mr-2"></i> Especialidades
                            </button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row">
                                        @for (esp of listaEspecialidades; track esp) {
                                        <div class="col-md-6 col-lg-4 mb-2">
                                            <label
                                                class="checkbox-card d-flex align-items-center p-2 rounded border cursor-pointer"
                                                [class.checkbox-card--selected]="estaSelecionado(dadosForm.especialidades, esp)"
                                                style="gap: 10px; cursor: pointer; transition: all 0.2s;">
                                                <input type="checkbox" class="form-check-input m-0" [id]="'esp_' + esp"
                                                    [checked]="estaSelecionado(dadosForm.especialidades, esp)"
                                                    (change)="toggleSelection('especialidades', esp)" />
                                                <span class="font-weight-500">{{ esp }}</span>
                                            </label>
                                        </div>
                                        }
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>

                    <!-- Disponibilidade -->
                    <div ngbAccordionItem>
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>
                                <i class="feather icon-calendar mr-2"></i> Disponibilidade
                            </button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row">

                                        <!-- Dias da Semana -->
                                        <div class="col-md-6 mb-3">
                                            <div class="card shadow-none border h-100">
                                                <div class="card-body p-3">
                                                    <h6
                                                        class="mb-3 font-weight-bold text-primary d-flex align-items-center border-bottom pb-2">
                                                        <i class="feather icon-calendar mr-2"></i> Dias da Semana
                                                    </h6>
                                                    @for (dia of listaDias; track $index) {
                                                    <label
                                                        class="d-flex align-items-center p-2 mb-2 rounded border cursor-pointer"
                                                        [class.bg-light-primary]="estaSelecionado(dadosForm.disponibilidade?.diasSemana, dia?.value)"
                                                        [class.border-primary]="estaSelecionado(dadosForm.disponibilidade?.diasSemana, dia?.value)"
                                                        style="gap: 10px; cursor: pointer; transition: all 0.2s;">
                                                        <input type="checkbox"
                                                            class="form-check-input m-0 flex-shrink-0"
                                                            [id]="'dia_' + dia?.value"
                                                            [checked]="estaSelecionado(dadosForm.disponibilidade?.diasSemana, dia?.value)"
                                                            (change)="toggleSelection('disponibilidade.diasSemana', dia?.value)" />
                                                        <span class="font-weight-500">{{ dia?.label }}</span>
                                                    </label>
                                                    }
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Turnos -->
                                        <div class="col-md-6 mb-3">
                                            <div class="card shadow-none border h-100">
                                                <div class="card-body p-3">
                                                    <h6
                                                        class="mb-3 font-weight-bold text-primary d-flex align-items-center border-bottom pb-2">
                                                        <i class="feather icon-clock mr-2"></i> Turnos
                                                    </h6>
                                                    @for (turno of listaTurnos; track $index) {
                                                    <label
                                                        class="d-flex align-items-center p-2 mb-2 rounded border cursor-pointer"
                                                        [class.bg-light-primary]="estaSelecionado(dadosForm.disponibilidade?.turnos, turno?.value)"
                                                        [class.border-primary]="estaSelecionado(dadosForm.disponibilidade?.turnos, turno?.value)"
                                                        style="gap: 10px; cursor: pointer; transition: all 0.2s;">
                                                        <input type="checkbox"
                                                            class="form-check-input m-0 flex-shrink-0"
                                                            [id]="'turno_' + turno?.value"
                                                            [checked]="estaSelecionado(dadosForm.disponibilidade?.turnos, turno?.value)"
                                                            (change)="toggleSelection('disponibilidade.turnos', turno?.value)" />
                                                        <span class="font-weight-500">{{ turno?.label }}</span>
                                                    </label>
                                                    }
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="text-right mt-4 pt-3 border-top">
                    <button type="button" class="btn btn-secondary mr-2" (click)="activeModal.dismiss()">
                        Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" (click)="salvar()">
                        <i class="feather icon-save mr-1"></i> Salvar Funcionário
                    </button>
                </div>

            </form>
        </app-card>
    </div>
</div>
