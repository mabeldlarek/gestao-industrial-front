<div class="row">
  <div class="col-sm-7">
    <app-card cardTitle="" [options]="false" blockClass="table-border-style">

      <!-- Barra de ações -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="">
          <input class="form-control search-btn" list="datalistOptions" id="exampleDataList"
            placeholder="Type to search..." />
        </div>
        <!-- Botões lado a lado -->
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-primary">
            <i class="feather icon-plus"></i>
            Adicionar
          </button>
          <button type="button" class="btn btn-danger" disabled>
            <i class="feather icon-trash-2"></i>
            Excluir
          </button>

        </div>
      </div>

      <!-- Tabela -->
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Nome</th>
              <th>Custo</th>
              <th>Estoque Atual</th>
              <th>Estoque Mínimo</th>
              <th>Localização</th>
              <th>Unidade de Medida</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of dados" (click)="selecionarItem(item)" [class.table-active]="estaSelecionado(item)">
              <td>
                <img class="rounded-circle" style="width: 40px" src="https://i.pravatar.cc/40" alt="Peça" />
              </td>
              <td>{{ item.codigoPeca }}</td>
              <td>{{ item.nome }}</td>
              <td>{{ item.custoUnitario }}</td>
              <td>{{ item.estoqueAtual }}</td>
              <td>{{ item.estoqueMinimo }}</td>
              <td>{{ item.localizacao }}</td>
              <td>{{ item.unidadeMedida }}</td>
              <td>
                <!-- Impede que o clique do botão selecione a linha -->
                <button type="button" class="btn btn-icon btn-warning" (click)="desabilitarEdicao($event)"
                  [disabled]="desabilitarEdicao()">
                  <i class="feather icon-edit"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
