name: 🚀 Deploy Angular App

on:
  push:
    branches:
      - main   # ou master, usa o nome da sua branch principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🛠️ Criar Environment de Produção
        run: |
          mkdir -p src/environments
          # A URL agora é HTTPS e aponta para o seu domínio fixo
          echo "export const environment = { production: true, apiUrl: 'https://${{ secrets.VM_HOST }}', appVersion: '1.0.0' };" > src/environments/environment.prod.ts  

      - name: 🔍 Debug (Verificar estrutura do arquivo)
        run: cat src/environments/environment.prod.ts | sed 's/[0-9]/x/g' # Mostra a estrutura sem vazar seu IP real

     - name: 🛠️ Build Angular
        run: |
          npm install
          # Note o comando de build sem as fontes que davam erro
          npm run build -- --configuration=production --optimization=false

      - name: 🚀 Deploy para a VM via SSH (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: mariabelarek
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "dist/*" 
          target: "/var/www/gestao-industrial/frontend"
          strip_components: 1 