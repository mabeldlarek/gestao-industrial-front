<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="" [options]="false">
      
      <div class="d-flex justify-content-between mb-3 gap-2">
        <input 
          class="form-control w-50" 
          placeholder="Buscar por nome ou e-mail..." 
          [(ngModel)]="termoPesquisa" 
          (input)="filtrarUsuarios()" 
        />
        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="adicionarUsuario()" title="Adicionar Novo Usuário">
            <i class="feather icon-plus"></i> Novo Usuário
          </button>
          <button 
            class="btn btn-danger" 
            [disabled]="itensSelecionados.length === 0" 
            (click)="confirmarExclusao()"
            title="Excluir Selecionados"
          >
            <i class="feather icon-trash"></i>
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Usuário</th>
              <th>Login/E-mail</th>
              <th>Perfil</th>
              <th>Status</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            @if (carregando) {
              <tr>
                <td colspan="5" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">Carregando...</span>
                  </div>
                </td>
              </tr>
            } @else {
              @for (item of dadosFiltrados; track item.id) {
                <tr 
                  (click)="selecionarItem(item)" 
                  [class.table-active]="itensSelecionados.includes(item)" 
                  style="cursor:pointer"
                >
                  <td><strong>{{ item.nome || item.nomeUsuario }}</strong></td>
                  <td>{{ item.email }}</td>
                  <td>
                    <span class="badge bg-light-info">{{ item.tipoUsuario }}</span>
                  </td>
                  <td>
                    <span class="badge {{ item.ativo ? 'bg-success' : 'bg-danger' }}">
                      {{ item.ativo ? 'Ativo' : 'Inativo' }}
                    </span>
                  </td>
                  <td class="text-right">
                    <button 
                      class="btn btn-sm btn-icon btn-warning" 
                      (click)="$event.stopPropagation(); editarUsuario(item)"
                      title="Editar Usuário"
                    >
                      <i class="feather icon-edit"></i>
                    </button>
                  </td>
                </tr>
              } @empty {
                <tr>
                  <td colspan="5" class="text-center text-muted py-4">
                    Nenhum usuário encontrado.
                  </td>
                </tr>
              }
            }
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
</div>
