name: 🚀 Deploy Angular App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🛠️ Criar Environment de Produção
        run: |
          mkdir -p src/environments
          # A URL agora usa o seu domínio DuckDNS e o prefixo /api que definimos no Nginx
          echo "export const environment = { production: true, apiUrl: 'https://gestao-industrial.duckdns.org/api', appVersion: '1.0.0' };" > src/environments/environment.prod.ts  

      - name: 🛠️ Build Angular
        run: npm run build -- --configuration=production --optimization=false

      - name: 🚀 Deploy para a VM via SSH (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: mariabelarek
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "dist/*" 
          target: "/var/www/gestao-industrial/frontend"
          strip_components: 1