<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="" [options]="false">
      <form action="javascript:void(0)">

        <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
          <div class="bg-light-primary text-primary p-2 rounded-circle mr-3 d-flex align-items-center justify-content-center"
            style="width: 45px; height: 45px;">
            <i class="feather icon-calendar font-weight-bold" style="font-size: 1.2rem;"></i>
          </div>
          <div>
            <h4 class="mb-0 font-weight-600 text-dark">
              {{ dadosForm.id ? 'Editar' : 'Novo' }} Plano de Manutenção
            </h4>
            <small class="text-muted">Configure a periodicidade e automação das manutenções</small>
          </div>
        </div>

        <div ngbAccordion [closeOthers]="true">

          <div ngbAccordionItem [collapsed]="false">
            <h2 ngbAccordionHeader>
              <button ngbAccordionButton>Informações e Vínculos</button>
            </h2>
            <div ngbAccordionCollapse>
              <div ngbAccordionBody>
                <div class="row">
                  <div class="form-group col-md-3">
                    <label>Código</label>
                    <input type="text" name="codigo" class="form-control" [(ngModel)]="dadosForm.codigo" placeholder="PLN-001" />
                  </div>
                  <div class="form-group col-md-9">
                    <label>Nome do Plano</label>
                    <input type="text" name="nome" class="form-control" [(ngModel)]="dadosForm.nome" placeholder="Ex: Preventiva Mensal Compressores" />
                  </div>
                </div>
                <div class="row">
                  <div class="form-group col-md-6">
                    <label>Equipamento</label>
                    <select name="equipamentoID" class="form-control" [(ngModel)]="dadosForm.equipamentoID">
                      <option [value]="null" disabled>Selecione o equipamento</option>
                      </select>
                  </div>
                  <div class="form-group col-md-6">
                    <label>Procedimento Padrão</label>
                    <select name="procedimentoID" class="form-control" [(ngModel)]="dadosForm.procedimentoID">
                      <option [value]="null" disabled>Selecione o procedimento</option>
                      </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div ngbAccordionItem>
            <h2 ngbAccordionHeader>
              <button ngbAccordionButton>Frequência e Tipo</button>
            </h2>
            <div ngbAccordionCollapse>
              <div ngbAccordionBody>
                <div class="row">
                  <div class="form-group col-md-4">
                    <label>Tipo de Manutenção</label>
                    <select name="tipoManutencao" class="form-control" [(ngModel)]="dadosForm.tipoManutencao">
                      <option value="PREVENTIVA">Preventiva</option>
                      <option value="PREDITIVA">Preditiva</option>
                    </select>
                  </div>
                  <div class="form-group col-md-4">
                    <label>Tipo de Frequência</label>
                    <select name="tipoFrequencia" class="form-control" [(ngModel)]="dadosForm.tipoFrequencia">
                      <option value="TEMPO">Tempo</option>
                      <option value="MEDIDOR">Medidor</option>
                    </select>
                  </div>
                  <div class="form-group col-md-4">
                    <label>Status</label>
                    <select name="status" class="form-control" [(ngModel)]="dadosForm.status">
                      <option value="ATIVO">Ativo</option>
                      <option value="INATIVO">Inativo</option>
                    </select>
                  </div>
                </div>
                <div class="row" *ngIf="dadosForm.tipoFrequencia === 'TEMPO'">
                  <div class="form-group col-md-6">
                    <label>Valor do Intervalo</label>
                    <input type="number" name="valorFrequencia" class="form-control" [(ngModel)]="dadosForm.valorFrequencia" />
                  </div>
                  <div class="form-group col-md-6">
                    <label>Unidade</label>
                    <select name="unidadeFrequencia" class="form-control" [(ngModel)]="dadosForm.unidadeFrequencia">
                      <option value="DIA">Dia(s)</option>
                      <option value="MES">Mês(es)</option>
                      <option value="ANO">Ano(s)</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div ngbAccordionItem>
            <h2 ngbAccordionHeader>
              <button ngbAccordionButton>Automação e Responsáveis</button>
            </h2>
            <div ngbAccordionCollapse>
              <div ngbAccordionBody>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <div class="form-check custom-control custom-checkbox">
                      <input type="checkbox" class="form-check-input custom-control-input" id="checkAuto" name="gerarOMAuto" [(ngModel)]="dadosForm.gerarOMAuto">
                      <label class="form-check-label custom-control-label" for="checkAuto">Gerar OM automaticamente por tempo</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-check custom-control custom-checkbox">
                      <input type="checkbox" class="form-check-input custom-control-input" id="checkMedidor" name="gerarOMAutoMedidor" [(ngModel)]="dadosForm.gerarOMAutoMedidor">
                      <label class="form-check-label custom-control-label" for="checkMedidor">Gerar OM automática por medidor</label>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="form-group col-md-6">
                    <label>Próxima Geração Automática</label>
                    <input type="datetime-local" name="dataGeracaoAuto" class="form-control" [(ngModel)]="dadosForm.dataGeracaoAuto" />
                  </div>
                  <div class="form-group col-md-6">
                    <label>Código do Medidor (opcional)</label>
                    <input type="text" name="codigoMedidor" class="form-control" [(ngModel)]="dadosForm.codigoMedidor" placeholder="Ex: HORA-MAQ-01" />
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>

        <div class="text-right mt-4 pb-2">
          <button type="button" class="btn btn-secondary mr-2" (click)="activeModal.dismiss()">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary" (click)="salvar()">
            <i class="feather icon-save mr-1"></i> 
            {{ dadosForm.id ? 'Atualizar' : 'Salvar' }} Plano
          </button>
        </div>
      </form>
    </app-card>
  </div>
</div>
