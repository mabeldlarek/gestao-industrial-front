<div class="row">
  <div class="col-sm-7">
    <app-card cardTitle="" [options]="false" blockClass="table-border-style">

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-stretch align-items-md-center mb-3 gap-2">

        <div class="flex-grow-1" style="max-width: 500px;">
          <input
            class="form-control"
            placeholder="Pesquisar por nome, código, tipo..."
            [(ngModel)]="termoPesquisa"
            (input)="filtrarEquipamentos()" />
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-primary" (click)="adicionarEquipamento()">
            <i class="feather icon-plus"></i>
            Adicionar
          </button>

          <button
            type="button"
            class="btn btn-danger"
            [disabled]="!podeExcluir"
            (click)="confirmarExclusao()">
            <i class="feather icon-trash-2"></i>
            Excluir
          </button>
        </div>

      </div>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th></th>
              <th>Nome</th>
              <th>Código</th>
              <th>Tipo</th>
              <th>Fabricante</th>
              <th>Modelo</th>
              <th>Status</th>
              <th>Criticidade</th>
              <th></th>
            </tr>
          </thead>

          <tbody>

            <tr
              *ngFor="let item of dadosFiltrados"
              (click)="selecionarItem(item)"
              [class.table-active]="estaSelecionado(item)"
              style="cursor:pointer">

              <td>
                <img
                  class="rounded-circle"
                  style="width:40px"
                  src="https://i.pravatar.cc/40"
                  alt="Equipamento"/>
              </td>

              <td>{{ item.nome }}</td>
              <td>{{ item.codigo }}</td>
              <td>{{ item.tipo }}</td>
              <td>{{ item.fabricante }}</td>
              <td>{{ item.modelo }}</td>
              <td>{{ item.statusOperacional }}</td>
              <td>{{ item.criticidadeID || 'N/A' }}</td>

              <td>
                <button
                  type="button"
                  class="btn btn-icon btn-warning"
                  (click)="$event.stopPropagation(); editarEquipamento()"
                  [disabled]="desabilitarEdicao()">

                  <i class="feather icon-edit"></i>

                </button>
              </td>

            </tr>

            <tr *ngIf="dadosFiltrados.length === 0">
              <td colspan="9" class="text-center text-muted py-4">
                Nenhum equipamento encontrado para
                "<strong>{{ termoPesquisa }}</strong>"
              </td>
            </tr>

          </tbody>
        </table>
      </div>

    </app-card>
  </div>
</div>
