<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="" [options]="false">
      <form action="javascript:void(0)">
        <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
          <div class="bg-light-primary text-primary p-2 rounded-circle mr-3 d-flex align-items-center justify-content-center"
            style="width: 45px; height: 45px;">
            <i class="feather icon-settings font-weight-bold" style="font-size: 1.2rem;"></i>
          </div>
          <div>
            <h4 class="mb-0 font-weight-600 text-dark">
              {{ dadosForm.id ? 'Editar' : 'Cadastro de' }} Peça
            </h4>
            <small class="text-muted">Gerencie informações técnicas e níveis de inventário</small>
          </div>
        </div>

        <div ngbAccordion [closeOthers]="true">
          <div ngbAccordionItem [collapsed]="false">
            <h2 ngbAccordionHeader>
              <button ngbAccordionButton>Informações Gerais</button>
            </h2>
            <div ngbAccordionCollapse>
              <div ngbAccordionBody>
                <ng-template>
                  <div class="row">
                    <div class="form-group col-md-3">
                      <label>Código da Peça</label>
                      <input type="text" name="codigoPeca" class="form-control" [(ngModel)]="dadosForm.codigoPeca" />
                    </div>
                    <div class="form-group col-md-6">
                      <label>Nome da Peça</label>
                      <input type="text" name="nome" class="form-control" [(ngModel)]="dadosForm.nome" />
                    </div>
                    <div class="form-group col-md-3">
                      <label>Fabricante</label>
                      <input type="text" name="fabricante" class="form-control" [(ngModel)]="dadosForm.fabricante" />
                    </div>
                  </div>
                  <div class="row">
                    <div class="form-group col-md-4">
                      <label>Nº de Catálogo</label>
                      <input type="text" name="numeroCatalogo" class="form-control" [(ngModel)]="dadosForm.numeroCatalogo" />
                    </div>
                    <div class="form-group col-md-8">
                      <label>Descrição Técnica</label>
                      <textarea name="descricao" class="form-control" rows="2" [(ngModel)]="dadosForm.descricao"></textarea>
                    </div>
                  </div>
                </ng-template>
              </div>
            </div>
          </div>

          <div ngbAccordionItem>
            <h2 ngbAccordionHeader>
              <button ngbAccordionButton>Inventário e Custos</button>
            </h2>
            <div ngbAccordionCollapse>
              <div ngbAccordionBody>
                <ng-template>
                  <div class="row">
                    <div class="form-group col-md-3">
                      <label>Custo Unitário</label>
                      <div class="input-group">
                        <div class="input-group-prepend"><span class="input-group-text">R$</span></div>
                        <input type="number" name="custoUnitario" class="form-control" [(ngModel)]="dadosForm.custoUnitario" />
                      </div>
                    </div>
                    <div class="form-group col-md-3">
                      <label>Estoque Atual</label>
                      <input type="number" name="estoqueAtual" class="form-control" [(ngModel)]="dadosForm.estoqueAtual" />
                    </div>
                    <div class="form-group col-md-3">
                      <label>Estoque Mínimo</label>
                      <input type="number" name="estoqueMinimo" class="form-control" [(ngModel)]="dadosForm.estoqueMinimo" />
                    </div>
                    <div class="form-group col-md-3">
                      <label>Unidade</label>
                      <select name="unidadeMedida" class="form-control" [(ngModel)]="dadosForm.unidadeMedida">
                        <option value="unidade">Unidade (un)</option>
                        <option value="kg">Quilo (kg)</option>
                        <option value="metro">Metro (m)</option>
                        <option value="litro">Litro (l)</option>
                      </select>
                    </div>
                  </div>
                </ng-template>
              </div>
            </div>
          </div>

          <div ngbAccordionItem>
            <h2 ngbAccordionHeader>
              <button ngbAccordionButton>Localização</button>
            </h2>
            <div ngbAccordionCollapse>
              <div ngbAccordionBody>
                <ng-template>
                  <div class="form-group">
                    <label>Localização no Almoxarifado</label>
                    <input type="text" name="localizacaoAlmoxarifado" class="form-control" 
                      [(ngModel)]="dadosForm.localizacaoAlmoxarifado" placeholder="Ex: Estante A, Prateleira 2" />
                  </div>
                </ng-template>
              </div>
            </div>
          </div>
        </div>

        <div class="text-right mt-4">
          <button type="button" class="btn btn-secondary mr-2" (click)="activeModal.dismiss()">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary" (click)="salvar()">
            <i class="feather icon-save mr-1"></i> {{ dadosForm.id ? 'Atualizar' : 'Salvar' }} Peça
          </button>
        </div>
      </form>
    </app-card>
  </div>
</div>
