<div class="row">
    <div class="col-sm-12">
        <app-card cardTitle="" [options]="false">
            <form action="javascript:void(0)">

                <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                    <div class="bg-light-primary text-primary p-2 rounded-circle mr-3 d-flex align-items-center justify-content-center"
                        style="width: 45px; height: 45px;">
                        <i class="feather icon-settings font-weight-bold" style="font-size: 1.2rem;"></i>
                    </div>
                    <div>
                        <h4 class="mb-0 font-weight-600 text-dark">Cadastro de Equipamento</h4>
                        <small class="text-muted">Preencha os campos para registrar um novo ativo no sistema</small>
                    </div>
                </div>

                <div ngbAccordion [closeOthers]="true">

                    <div ngbAccordionItem [collapsed]="false">
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>Informações do Equipamento</button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row">
                                        <div class="form-group col-md-3">
                                            <label>Código</label>
                                            <input type="text" name="codigo" class="form-control"
                                                [(ngModel)]="dadosForm.codigo" placeholder="Código" />
                                        </div>
                                        <div class="form-group col-md-6">
                                            <label>Nome</label>
                                            <input type="text" name="nome" class="form-control"
                                                [(ngModel)]="dadosForm.nome" placeholder="Nome do equipamento" />
                                        </div>
                                        <div class="form-group col-md-3">
                                            <label>Criticidade</label>
                                            <input type="text" name="criticidade" class="form-control"
                                                [(ngModel)]="dadosForm.criticidadeID" placeholder="Criticidade" />
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="form-group col-md-6">
                                            <label>Tipo</label>
                                            <select name="tipo" class="form-control" [(ngModel)]="dadosForm.tipo">
                                                <option selected disabled>Selecione o tipo</option>
                                                <option>Sensor</option>
                                                <option>Motor</option>
                                                <option>Bomba</option>
                                            </select>
                                        </div>
                                        <div class="form-group col-md-6">
                                            <label>Status Operacional</label>
                                            <select name="status" class="form-control"
                                                [(ngModel)]="dadosForm.statusOperacional">
                                                <option selected disabled>Selecione</option>
                                                <option>Operacional</option>
                                                <option>Em Manutenção</option>
                                                <option>Inoperante</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Descrição</label>
                                        <textarea name="descricao" class="form-control" rows="3"
                                            [(ngModel)]="dadosForm.descricao"
                                            placeholder="Descrição detalhada do equipamento"></textarea>
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>

                    <div ngbAccordionItem>
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>Identificação</button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row">
                                        <div class="form-group col-md-4">
                                            <label>Número de Série</label>
                                            <input type="text" name="serial" class="form-control"
                                                [(ngModel)]="dadosForm.numeroSerie" />
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label>Fabricante</label>
                                            <select name="fabricante" class="form-control"
                                                [(ngModel)]="dadosForm.fabricante">
                                                <option selected disabled>Selecione o fabricante</option>
                                                <option>Fabricante A</option>
                                                <option>SKF</option>
                                            </select>
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label>Modelo</label>
                                            <input type="text" name="modelo" class="form-control"
                                                [(ngModel)]="dadosForm.modelo" />
                                        </div>
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>

                    <div ngbAccordionItem>
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>Localização e Datas</button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label>Localização Física</label>
                                                <select name="local" class="form-control"
                                                    [(ngModel)]="dadosForm.localizacao">
                                                    <option selected disabled>Selecione o local</option>
                                                    <option>Planta A</option>
                                                    <option>Planta Central - Sala 1</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-8">
                                            <div class="row">
                                                <div class="form-group col-md-6">
                                                    <label>Data de Instalação</label>
                                                    <input type="datetime-local" name="dataInst"
                                                        class="form-control form-control-sm"
                                                        [(ngModel)]="dadosForm.dataInstalacao" />
                                                </div>
                                                <div class="form-group col-md-6">
                                                    <label>Última Manutenção</label>
                                                    <input type="datetime-local" name="dataManut"
                                                        class="form-control form-control-sm"
                                                        [(ngModel)]="dadosForm.dataUltimaManutencao" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>

                    <div ngbAccordionItem>
                        <h2 ngbAccordionHeader>
                            <button ngbAccordionButton>Parâmetros Operacionais</button>
                        </h2>
                        <div ngbAccordionCollapse>
                            <div ngbAccordionBody>
                                <ng-template>
                                    <div class="row" *ngIf="dadosForm.parametrosOperacionais">
                                        <div class="form-group col-md-6">
                                            <label>Faixa de Frequência (Hz)</label>
                                            <input type="text" name="faixa" class="form-control"
                                                placeholder="Ex: 10-1000"
                                                [(ngModel)]="dadosForm.parametrosOperacionais.faixaHz" />
                                        </div>
                                        <div class="form-group col-md-6">
                                            <label>Vibração Máxima (mm/s)</label>
                                            <input type="number" name="vibra" step="0.01" class="form-control"
                                                [(ngModel)]="dadosForm.parametrosOperacionais.vibracaoMax_mm_s" />
                                        </div>
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                    </div>
                    <div class="input-group">
                        <input type="text" name="criticidade" class="form-control" [(ngModel)]="dadosForm.criticidadeID"
                            placeholder="ID Criticidade" readonly />
                        <button class="btn btn-icon btn-outline-danger" type="button"
                            (click)="abrirCalculoCriticidade()" ngbTooltip="Calcular Criticidade">
                            <i class="feather icon-target"></i>
                        </button>
                    </div>
                </div>

                <div class="text-right">
                    <button type="button" class="btn btn-primary mt-4" (click)="salvar()">
                        Salvar Equipamento
                    </button>
                </div>
            </form>
        </app-card>
    </div>
</div>
